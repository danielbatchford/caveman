<svg xmlns="http://www.w3.org/2000/svg" width="860" height="384" aria-label="caveman proxy pipeline: agent to proxy (record, compress, pixel) to provider, with a CCR store and recovery-handle side channel, and a pixel branch rendering text slabs to PNG pages" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" role="img" viewBox="0 0 860 384"><style>.ln{stroke-width:1.4}.box,.ln,.thin{stroke:#8b949e;fill:none}.thin{stroke-width:1;opacity:.7}.box{stroke-width:1.4}.tx{fill:#57606a}.dim{fill:#8b949e}.dash{stroke:#8b949e;fill:none;stroke-width:1.2;stroke-dasharray:4 3}@media (prefers-color-scheme:dark){.box,.ln{stroke:#7d8590}.dash,.thin{stroke:#768390}.tx{fill:#adbac7}.dim{fill:#768390}}</style><defs><marker id="ah" markerHeight="9" markerWidth="9" orient="auto" refX="7" refY="4"><path d="M0,0 L8,4 L0,8" class="ln"/></marker></defs><rect width="150" height="64" x="24" y="34" class="box" rx="6"/><text x="99" y="62" class="tx" font-size="13" text-anchor="middle">coding agent</text><text x="99" y="80" class="dim" font-size="9" text-anchor="middle">claude · hermes · codex …</text><text x="252" y="58" class="dim" font-size="10" text-anchor="middle">request</text><line x1="174" x2="328" y1="66" y2="66" marker-end="url(#ah)" class="ln"/><rect width="222" height="92" x="330" y="20" class="box" rx="6"/><text x="441" y="44" class="tx" font-size="13" text-anchor="middle">caveman proxy</text><rect width="60" height="34" x="342" y="62" class="thin" rx="4"/><text x="372" y="83" class="dim" font-size="10" text-anchor="middle">record</text><rect width="74" height="34" x="410" y="62" class="thin" rx="4"/><text x="447" y="83" class="dim" font-size="10" text-anchor="middle">compress</text><rect width="48" height="34" x="492" y="62" class="thin" rx="4"/><text x="516" y="83" class="dim" font-size="10" text-anchor="middle">pixel</text><text x="629" y="58" class="dim" font-size="10" text-anchor="middle">upstream</text><line x1="552" x2="704" y1="66" y2="66" marker-end="url(#ah)" class="ln"/><rect width="130" height="64" x="706" y="34" class="box" rx="6"/><text x="771" y="62" class="tx" font-size="13" text-anchor="middle">provider</text><text x="771" y="80" class="dim" font-size="9" text-anchor="middle">anthropic · openai · gemini</text><line x1="441" x2="441" y1="112" y2="164" marker-end="url(#ah)" class="ln"/><text x="451" y="140" class="dim" font-size="9">store original first</text><rect width="222" height="54" x="330" y="164" class="box" rx="6"/><text x="441" y="187" class="tx" font-size="12" text-anchor="middle">CCR store</text><text x="441" y="205" class="dim" font-size="9" text-anchor="middle">original bytes · byte-exact</text><path marker-end="url(#ah)" d="M330,196 C 210,196 99,180 99,100" class="dash"/><text x="150" y="150" class="dim" font-size="9" text-anchor="middle">X-Caveman-Recovery-Handle</text><text x="150" y="163" class="dim" font-size="9" text-anchor="middle">→ caveman_retrieve (MCP)</text><line x1="24" x2="836" y1="250" y2="250" class="thin" opacity=".35"/><text x="24" y="278" class="tx" font-size="11">pixel branch</text><rect width="82" height="80" x="120" y="272" class="box" rx="3"/><line x1="128" x2="194" y1="284" y2="284" class="thin"/><line x1="128" x2="194" y1="293" y2="293" class="thin"/><line x1="128" x2="188" y1="302" y2="302" class="thin"/><line x1="128" x2="194" y1="311" y2="311" class="thin"/><line x1="128" x2="184" y1="320" y2="320" class="thin"/><line x1="128" x2="194" y1="329" y2="329" class="thin"/><line x1="128" x2="176" y1="338" y2="338" class="thin"/><text x="161" y="366" class="dim" font-size="9" text-anchor="middle">text slab</text><line x1="208" x2="248" y1="312" y2="312" marker-end="url(#ah)" class="ln"/><rect width="56" height="66" x="272" y="284" class="box" rx="3"/><rect width="56" height="66" x="280" y="278" class="box" rx="3"/><rect width="56" height="66" x="288" y="272" class="box" rx="3"/><text x="316" y="308" class="dim" font-size="9" text-anchor="middle">PNG</text><text x="308" y="36