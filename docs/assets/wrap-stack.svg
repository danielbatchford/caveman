<svg xmlns="http://www.w3.org/2000/svg" width="860" height="360" aria-label="caveman wrap architecture: coding agent to a local caveman proxy to the provider on the main line with auth passed through byte-exact, a CCR store below the proxy holding original bytes with a recovery handle back to the agent, and an MCP toolkit side-channel exposing retrieve, toon encode/decode, and browse" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" role="img" viewBox="0 0 860 360"><style>.box,.ln{stroke:#8b949e;fill:none;stroke-width:1.4}.tx{fill:#57606a}.dim{fill:#8b949e}.dash{stroke:#8b949e;fill:none;stroke-width:1.2;stroke-dasharray:4 3}@media (prefers-color-scheme:dark){.box,.ln{stroke:#7d8590}.dash{stroke:#768390}.tx{fill:#adbac7}.dim{fill:#768390}}</style><defs><marker id="ah" markerHeight="9" markerWidth="9" orient="auto" refX="7" refY="4"><path d="M0,0 L8,4 L0,8" class="ln"/></marker></defs><rect width="150" height="60" x="24" y="36" class="box" rx="6"/><text x="99" y="62" class="tx" font-size="13" text-anchor="middle">coding agent</text><text x="99" y="80" class="dim" font-size="9" text-anchor="middle">claude · hermes · codex …</text><text x="256" y="58" class="dim" font-size="10" text-anchor="middle">request</text><line x1="174" x2="338" y1="66" y2="66" marker-end="url(#ah)" class="ln"/><rect width="200" height="80" x="340" y="26" class="box" rx="6"/><text x="440" y="58" class="tx" font-size="13" text-anchor="middle">local caveman proxy</text><text x="440" y="78" class="dim" font-size="9" text-anchor="middle">S4 compress · TOON best-of · on your machine</text><text x="622" y="58" class="dim" font-size="10" text-anchor="middle">upstream</text><line x1="540" x2="704" y1="66" y2="66" marker-end="url(#ah)" class="ln"/><text x="622" y="126" class="dim" font-size="9" text-anchor="middle">auth untouched — API key or OAuth</text><text x="622" y="138" class="dim" font-size="9" text-anchor="middle">Bearer pass through byte-exact</text><rect width="130" height="60" x="706" y="36" class="box" rx="6"/><text x="771" y="62" class="tx" font-size="13" text-anchor="middle">provider</text><text x="771" y="80" class="dim" font-size="9" text-anchor="middle">anthropic · openai · gemini</text><line x1="440" x2="440" y1="106" y2="150" marker-end="url(#ah)" class="ln"/><text x="450" y="132" class="dim" font-size="9">store original first</text><rect width="228" height="56" x="326" y="150" class="box" rx="6"/><text x="440" y="174" class="tx" font-size="12" text-anchor="middle">CCR store</text><text x="440" y="192" class="dim" font-size="9" text-anchor="middle">original bytes · byte-exact · on your disk</text><path marker-end="url(#ah)" d="M326,183 C 210,183 110,150 110,98" class="dash"/><text x="155" y="128" class="dim" font-size="9" text-anchor="middle">X-Caveman-Recovery-Handle</text><text x="155" y="141" class="dim" font-size="9" text-anchor="middle">→ caveman_retrieve (MCP)</text><path marker-end="url(#ah)" d="M50,96 L50,283 L278,283" class="ln"/><text x="58" y="196" class="dim" font-size="9">MCP side-channel</text><rect width="460" height="64" x="280" y="252" class="box" rx="6"/><text x="510" y="278" class="tx" font-size="12" text-anchor="middle">MCP toolkit</text><text x="510" y="298" class="dim" font-size="9" text-anchor="middle">caveman_retrieve · toon encode/decode · browse (compressed a11y tree)</text></svg>